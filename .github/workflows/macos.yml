name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build Vesper.app
        run: ./macos/scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Vesper-macOS
          path: macos/dist/Vesper.app
          if-no-files-found: error
